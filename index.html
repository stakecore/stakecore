<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#000000" />
  <!-- Theme, before first paint. Reads the saved choice, else dark, and
       stamps <html data-theme> so theme.css picks the palette before the
       first frame — a module can't do this, it loads too late.
       prefers-color-scheme is deliberately not consulted: dark is the
       default for everyone who has not pressed the toggle. The storage key
       and the resolution order are the theme store's (src/features/theme);
       prepaint.test.ts keeps them in step. This is the one sanctioned touch
       of localStorage outside safeStorage.ts, and the access is in a try for
       the same reasons that file gives. -->
  <script>
    (function () {
      var t
      try { t = localStorage.getItem('stakecore:theme') } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = 'dark'
      document.documentElement.dataset.theme = t
      var m = document.querySelector('meta[name="theme-color"]')
      if (m) m.setAttribute('content', t === 'light' ? '#ffffff' : '#000000')
    })()
  </script>
  <title>StakeCore</title>
  <link rel="canonical" href="https://stakecore.org/" />
  <meta name="description" content="StakeCore operates blockchain node infrastructure, today running validator and FSP/SSP signing for the Flare, Avalanche, and Songbird networks. Non-custodial delegation, transparent on-chain reporting." />
  <!-- The app is a hash router, so this is the only HTML document the server
       ever returns — the metadata here describes the site, not a route. The
       per-route content lives in the markdown mirrors indexed by /llms.txt;
       see the agent readability section in CLAUDE.md. -->
  <link rel="alternate" type="text/markdown" href="/index.md" title="StakeCore (markdown)" />
  <link rel="alternate" type="text/plain" href="/llms.txt" title="llms.txt" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://stakecore.org/" />
  <meta property="og:title" content="StakeCore — staking infrastructure for Flare, Songbird, Avalanche" />
  <meta property="og:description" content="Validator and FSP/SSP signing infrastructure across Flare, Avalanche, and Songbird. Non-custodial delegation, transparent on-chain reporting." />
  <!-- TODO: add a 1200x630 social card and point og:image / twitter:image at it. -->
  <meta name="twitter:card" content="summary_large_image" />
  <!-- Fonts are self-hosted (see src/assets/css/fonts.css). Preloading them
       here starts the fetch during HTML parse, in parallel with the bundle,
       instead of waiting for the stylesheet to be parsed first. Roboto Mono
       is deliberately not preloaded — only the validator picker uses it. -->
  <link rel="preload" href="/fonts/inter-latin-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/major-mono-display-latin.woff2" as="font" type="font/woff2" crossorigin>
  <!-- Inline and static rather than injected at runtime: a crawler that does
       not execute JavaScript is precisely the reader this is for. The
       BreadcrumbList names the hash routes, which is the only form of them a
       human can navigate to. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Organization",
        "@id": "https://stakecore.org/#organization",
        "name": "StakeCore",
        "url": "https://stakecore.org/",
        "description": "Blockchain node infrastructure on a self-hosted, geographically distributed cluster. Validator duty and core protocol signing for the Flare, Songbird, and Avalanche networks are what runs on it today; the cluster is general-purpose and not tied to those chains or to validating roles.",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Ljubljana",
          "addressCountry": "SI"
        },
        "legalName": "Sarisoma d.o.o.",
        "sameAs": ["https://t.me/+xZoChBQyyCo3OGY0"]
      },
      {
        "@type": "WebSite",
        "@id": "https://stakecore.org/#website",
        "url": "https://stakecore.org/",
        "name": "StakeCore",
        "description": "Validator infrastructure for Flare, Songbird, and Avalanche. Non-custodial delegation, transparent on-chain reporting.",
        "inLanguage": "en",
        "publisher": { "@id": "https://stakecore.org/#organization" }
      },
      {
        "@type": "BreadcrumbList",
        "@id": "https://stakecore.org/#breadcrumbs",
        "itemListElement": [
          { "@type": "ListItem", "position": 1, "name": "StakeCore", "item": "https://stakecore.org/" },
          { "@type": "ListItem", "position": 2, "name": "About", "item": "https://stakecore.org/#/about" },
          { "@type": "ListItem", "position": 3, "name": "News", "item": "https://stakecore.org/#/news" },
          { "@type": "ListItem", "position": 4, "name": "Contact", "item": "https://stakecore.org/#/contact" },
          { "@type": "ListItem", "position": 5, "name": "Flare Systems Protocol", "item": "https://stakecore.org/#/flare/fsp" },
          { "@type": "ListItem", "position": 6, "name": "Songbird Systems Protocol", "item": "https://stakecore.org/#/songbird/fsp" },
          { "@type": "ListItem", "position": 7, "name": "Flare Validator", "item": "https://stakecore.org/#/flare/validator" },
          { "@type": "ListItem", "position": 8, "name": "Avalanche Validator", "item": "https://stakecore.org/#/avalanche/validator" }
        ]
      }
    ]
  }
  </script>
</head>

<body>
  <div id="root"></div>
  <div id="eip6963"></div>
  <div id="overlay"></div>
  <script type="module" src="src/main.tsx"></script>
</body>

</html>
